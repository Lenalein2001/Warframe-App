name: Windows packages
on:
  push:
    branches: [senpai]
    paths: ['src/**', 'web/**', 'tests/**', 'tools/**', 'packaging/**', 'licenses/**', '*.props', '*.slnx', 'LICENSE', 'docs/USAGE.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build minimal OCR fallback
        shell: pwsh
        run: ./tools/build-ocr.ps1 -OutputDirectory artifacts/ocr
      - name: Build and test packages
        shell: pwsh
        run: |
          ./tools/publish-companion.ps1 -TesseractRoot "$PWD/artifacts/ocr"
          python tests/launcher.test.py src/Native/build/Release
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher tests failed.' }
          $env:PATH = "$PWD/artifacts/ocr;$env:PATH"
          $env:TESSDATA_PREFIX = "$PWD/artifacts/ocr/tessdata"
          dotnet run --project tests/WarframeCompanion.Tests -c Release -- --ocr
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          python tools/smoke-desktop-package.py (Get-ChildItem artifacts/companion-win-x64-* -Directory | Select-Object -Last 1).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Package smoke tests failed.' }
          $package = Get-ChildItem artifacts/companion-win-x64-* -Directory | Select-Object -Last 1
          ./tools/build-installer.ps1 -PackageDirectory $package.FullName
          ./tools/smoke-installer.ps1 -Installer (Join-Path $package.FullName 'WarframeCompanion-win-x64-Setup.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: WarframeCompanion-win-x64
          path: |
            artifacts/companion-win-x64-*/*.zip
            artifacts/companion-win-x64-*/measurements.json
            artifacts/companion-win-x64-*/*Setup.exe
            artifacts/companion-win-x64-*/SHA256SUMS-windows.txt
