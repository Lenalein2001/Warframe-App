name: Windows packages
on:
  push:
    branches: [senpai]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: mingw-w64-ucrt-x86_64-tesseract-ocr zip
      - name: Bundle OCR fallback
        shell: msys2 {0}
        run: bash .github/bundle-tesseract.sh "$(cygpath -u "$GITHUB_WORKSPACE")/tesseract.zip"
      - name: Build and test packages
        shell: pwsh
        run: |
          Expand-Archive tesseract.zip -DestinationPath artifacts/ocr
          ./tools/publish-companion.ps1 -TesseractRoot "$PWD/artifacts/ocr"
          $env:PATH = "$PWD/artifacts/ocr;$env:PATH"
          $env:TESSDATA_PREFIX = "$PWD/artifacts/ocr/tessdata"
          dotnet run --project tests/WarframeCompanion.Tests -c Release -- --ocr
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          python tools/smoke-desktop-package.py (Get-ChildItem artifacts/companion-win-x64-* -Directory | Select-Object -Last 1).FullName
          if ($LASTEXITCODE -ne 0) { throw 'Package smoke tests failed.' }
          $package = Get-ChildItem artifacts/companion-win-x64-* -Directory | Select-Object -Last 1
          ./tools/build-installer.ps1 -PackageDirectory $package.FullName
          ./tools/smoke-installer.ps1 -Installer (Join-Path $package.FullName 'WarframeCompanion-win-x64-Setup.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: WarframeCompanion-win-x64
          path: |
            artifacts/companion-win-x64-*/*.zip
            artifacts/companion-win-x64-*/measurements.json
            artifacts/companion-win-x64-*/*Setup.exe
      - name: Attach C# packages to release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $folder = Get-ChildItem artifacts/companion-win-x64-* -Directory | Select-Object -Last 1
          foreach ($edition in @('framework-dependent', 'self-contained')) {
            $asset = Join-Path $folder.FullName "WarframeCompanion-win-x64-$edition.zip"
            Copy-Item -LiteralPath (Join-Path $folder.FullName "$edition.zip") -Destination $asset
            gh release upload "$env:RELEASE_TAG" "$asset" --repo "$env:GITHUB_REPOSITORY"
            if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }
          }
          gh release upload "$env:RELEASE_TAG" (Join-Path $folder.FullName 'WarframeCompanion-win-x64-Setup.exe') --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw 'Installer upload failed.' }
