name: Windows packages
on:
  push:
    branches: [senpai]
    paths: ['assets/**', 'src/**', 'web/**', 'tests/**', 'tools/**', 'packaging/**', 'licenses/**', '*.props', 'VERSION', '*.slnx', 'LICENSE', 'docs/USAGE.md', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build minimal OCR fallback
        shell: pwsh
        run: ./tools/build-ocr.ps1 -OutputDirectory artifacts/ocr
      - name: Build and test packages
        shell: pwsh
        run: |
          python tests/archive.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Archive tests failed.' }
          python tests/windows-release.test.py
          if ($LASTEXITCODE -ne 0) { throw 'Release privacy or OCR pin test failed.' }
          $package = 'artifacts/windows-package'
          ./tools/publish-companion.ps1 -OutputDirectory $package
          python tools/smoke-single-file.py "artifacts/windows-package/single-file/portable/WarframeCompanion-win-x64.exe" artifacts/windows-package/single-file/startup-smoke.json
          if ($LASTEXITCODE -ne 0) { throw 'Single-file checks failed.' }
          python tests/runtime-requirement.test.py "artifacts/windows-package/single-file/portable/WarframeCompanion-win-x64.exe"
          if ($LASTEXITCODE -ne 0) { throw 'Single-file missing-runtime test failed.' }
          python tests/launcher.test.py src/Native/build/Release
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher tests failed.' }
          $env:PATH = "$PWD/artifacts/ocr;$env:PATH"
          $env:TESSDATA_PREFIX = "$PWD/artifacts/ocr/tessdata"
          dotnet run --project tests/WarframeCompanion.Tests -c Release -- --ocr
          if ($LASTEXITCODE -ne 0) { throw 'Regression tests failed.' }
          python tools/smoke-desktop-package.py $package
          if ($LASTEXITCODE -ne 0) { throw 'Package smoke tests failed.' }
          python tests/runtime-requirement.test.py (Join-Path $package 'framework-dependent/WarframeCompanion.Desktop.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Missing runtime test failed.' }
          ./tools/build-installer.ps1 -PackageDirectory $package
          ./tools/build-installer.ps1 -PackageDirectory $package -IsolatedTest
          ./tools/smoke-installer.ps1 -Installer (Join-Path $package 'installer-test/WarframeCompanion-win-x64-TestSetup.exe')
      - uses: actions/upload-artifact@v4
        with:
          name: WarframeCompanion-win-x64
          path: |
            artifacts/windows-package/*.zip
            artifacts/windows-package/measurements.json
            artifacts/windows-package/*Setup.exe
            artifacts/windows-package/SHA256SUMS-windows.txt
            artifacts/windows-package/single-file/portable/*.exe
            artifacts/windows-package/single-file/package.json
            artifacts/windows-package/single-file/startup-smoke.json
