name: Linux packages
on:
  push:
    branches: [senpai]
    paths: ['src/**', 'web/**', 'tests/**', 'tools/**', 'packaging/**', '*.props', 'docs/USAGE.md', '.github/workflows/linux.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install native dependencies
        run: |
          printf '%s\n' 'https://mirrors.edge.kernel.org/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt /etc/apt/apt-mirrors-security.txt
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libnotify4 xvfb dbus-x11 dunst scrot x11-utils tesseract-ocr
      - name: Build portable archive and Debian installer
        run: bash tools/package-linux.sh 0.1.0
      - name: Test extracted portable archive and installed package
        run: |
          mkdir -p artifacts/linux-extracted
          tar -xzf artifacts/linux-release/WarframeCompanion-linux-x64-portable.tar.gz -C artifacts/linux-extracted
          test -x artifacts/linux-extracted/WarframeCompanion.Desktop
          test -x artifacts/linux-extracted/Portable.sh
          dbus-run-session -- xvfb-run -a python3 tools/smoke-linux-desktop.py artifacts/linux-extracted/WarframeCompanion.Desktop
          sudo apt-get install -y ./artifacts/linux-release/WarframeCompanion-linux-x64.deb
          dbus-run-session -- xvfb-run -a python3 tools/smoke-linux-desktop.py /usr/bin/warframe-companion
          mkdir -p "$HOME/.local/share/WarframeCompanion"
          printf 'preserve-me' > "$HOME/.local/share/WarframeCompanion/package-test-sentinel"
          sudo apt-get install --reinstall -y ./artifacts/linux-release/WarframeCompanion-linux-x64.deb
          sudo apt-get remove -y warframe-companion
          test "$(cat "$HOME/.local/share/WarframeCompanion/package-test-sentinel")" = preserve-me
      - uses: actions/upload-artifact@v4
        with:
          name: WarframeCompanion-linux-x64
          path: artifacts/linux-release/*
