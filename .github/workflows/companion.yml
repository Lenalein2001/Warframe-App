name: CSharp and native validation
on:
  push:
    paths: ['src/**', 'tests/**', 'web/**', 'tools/**', 'nix/**', '*.nix', '*.props', '*.slnx', 'run.sh', 'docs/migration/contracts.json', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/migration-contracts.py --check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-native.ps1
      - if: runner.os != 'Windows'
        run: |
          # The hosted runner's HTTP Azure mirror can time out per package.
          # Use Ubuntu's HTTPS mirrors in this disposable CI image.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors.txt
          fi
          if [ -f /etc/apt/apt-mirrors-security.txt ]; then
            printf '%s\n' 'https://security.ubuntu.com/ubuntu' | sudo tee /etc/apt/apt-mirrors-security.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install --no-install-recommends -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev libnotify4 xvfb dbus-x11 dunst scrot x11-utils tesseract-ocr
          cmake -S src/Native -B src/Native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build src/Native/build --parallel
          ctest --test-dir src/Native/build --output-on-failure
      - run: dotnet restore tests/WarframeCompanion.Tests/Tests.csproj --locked-mode
      - run: dotnet run --project tests/WarframeCompanion.Tests/Tests.csproj -c Release --no-restore
      - run: dotnet restore src/App/App.csproj --locked-mode
      - run: dotnet build src/App/App.csproj -c Release --no-restore
      - run: dotnet restore src/Desktop/Desktop.csproj --locked-mode
      - run: dotnet build src/Desktop/Desktop.csproj -c Release --no-restore
      - if: runner.os != 'Windows'
        run: |
          dotnet run --project tests/WarframeCompanion.Tests -c Release --no-restore -- --ocr
          dbus-run-session -- xvfb-run -a -s '-screen 0 1920x1080x24' python tools/smoke-linux-desktop.py
  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
      - run: nix-build --no-out-link
