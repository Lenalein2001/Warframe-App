name: CSharp migration
on:
  push:
    paths: ['companion/**', 'web/**', 'src/server.rs', 'tools/migration-contracts.py', 'docs/migration/contracts.json', '.github/workflows/companion.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/migration-contracts.py --check
      - if: runner.os == 'Windows'
        shell: pwsh
        run: ./tools/build-native.ps1
      - if: runner.os != 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libgtk-layer-shell-dev
          cmake -S companion/Native -B companion/Native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build companion/Native/build --parallel
          ctest --test-dir companion/Native/build --output-on-failure
      - run: dotnet restore companion/Tests/Tests.csproj --locked-mode
      - run: dotnet run --project companion/Tests/Tests.csproj -c Release --no-restore
      - run: dotnet restore companion/App/App.csproj --locked-mode
      - run: dotnet build companion/App/App.csproj -c Release --no-restore
      - run: dotnet restore companion/Desktop/Desktop.csproj --locked-mode
      - run: dotnet build companion/Desktop/Desktop.csproj -c Release --no-restore
